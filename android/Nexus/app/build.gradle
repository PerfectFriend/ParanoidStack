plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace         'com.nexuschat.app'
    compileSdk        34

    defaultConfig {
        applicationId   "com.nexuschat.app"
        minSdk          26          // Android 8.0 — BiometricPrompt, WebAuthn
        targetSdk       34
        versionCode     1
        versionName     "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Native ABIs — include all for broad device support
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        // Tor SOCKS5 proxy meta-data
        manifestPlaceholders = [
            torSocksPort    : "9050",
            torControlPort  : "9051",
        ]
    }

    signingConfigs {
        // Release signing — fill keystore path / passwords before building
        release {
            storeFile     file(project.findProperty("KEYSTORE_PATH") ?: "nexuschat.keystore")
            storePassword project.findProperty("KEYSTORE_PASS") ?: ""
            keyAlias      project.findProperty("KEY_ALIAS")     ?: "nexuschat"
            keyPassword   project.findProperty("KEY_PASS")      ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix   "-DEBUG"
            debuggable          true
            // DO NOT minify debug — WebView JS console still works
            minifyEnabled       false
        }
        release {
            minifyEnabled       true
            shrinkResources     true
            signingConfig       signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
        ]
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
            ]
        }
    }

    // Assets config for WebView
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.name == 'debug') {
            variant.assembleProvider.configure {
                doLast {
                    copy {
                        from variant.outputs.first().outputFile
                        into '/home/thomas/ApkExport'
                        rename '.*', 'Nexus.apk'
                    }
                }
            }
        }
    }
}

dependencies {
    // ── CORE ANDROID ──────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ── WEBVIEW (Chromium-based, hardware-accelerated) ─────────────
    // Using system WebView; no additional dep needed.
    // For pinned Chromium version use Android WebView via Play:
    //   implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'

    // ── TOR ────────────────────────────────────────────────────────
    // tor-android: embeds Tor daemon, exposes SOCKS5 + control port
    implementation 'info.guardianproject:tor-android:0.4.7.14'
    // jtorctl: Java Tor controller (NEWNYM, circuit monitoring)
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    // NetCipher: forces OkHttp through SOCKS5 proxy
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'

    // ── NETWORKING ────────────────────────────────────────────────
    // OkHttp: HTTP/WebSocket client (for SMP WebSocket + Tailscale API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Retrofit: type-safe Tailscale REST API client
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Gson: JSON serialisation for SMP frames
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── TAILSCALE ─────────────────────────────────────────────────
    // Official Tailscale Android SDK
    // Requires Tailscale credentials in gradle.properties:
    // tailscaleUsername=your-username tailscalePassword=your-password
    // implementation 'com.tailscale.ipn:tailscale-android:1.66.0'

    // ── CRYPTOGRAPHY ──────────────────────────────────────────────
    // Tink: AES-256-GCM for file encryption (replaces raw AES)
    implementation 'com.google.crypto.tink:tink-android:1.12.0'
    // Conscrypt: modern TLS provider (TLS 1.3, better cipher suites)
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    // BouncyCastle: Ed25519/X25519 fallback if needed
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    // ── SECURE STORAGE (Android Keystore) ─────────────────────────
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Encrypted SharedPreferences for PIN/config
    implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'

    // ── BIOMETRICS ────────────────────────────────────────────────
    implementation 'androidx.biometric:biometric-ktx:1.2.0-alpha05'

    // ── DATABASE (Room — backup for IndexedDB) ────────────────────
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // WireGuard uses ProcessBuilder for wg-quick; no additional library needed

    // ── NOTIFICATIONS ─────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'  // NotificationCompat

    // ── WEBRTC (voice calls) ──────────────────────────────────────
    // WebRTC M114 pre-built AAR (Google)
    implementation 'io.github.webrtc-sdk:android:114.5735.02'
    // Alternative: compile from source at webrtc.googlesource.com

    // ── IMAGE LOADING (avatars, media thumbnails) ─────────────────
    implementation 'io.coil-kt:coil:2.5.0'

    // ── COROUTINES ────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ── QR CODE ───────────────────────────────────────────────────
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ── FOREGROUND SERVICE (SMP server, Tor daemon) ───────────────
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // ── TESTS ─────────────────────────────────────────────────────
    testImplementation     'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
