pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://raw.githubusercontent.com/guardianproject/gpmaven/master' }
        // Tailscale Android SDK - requires authentication token
        // Add Tailscale token to gradle.properties: tailscaleUsername=... tailscalePassword=...
        maven { url 'https://pkgs.tailscale.com/android' }
    }
}

rootProject.name = "NexusChat"
include ':app'
